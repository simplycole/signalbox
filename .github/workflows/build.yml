name: Signalbox CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            libao-dev \
            libavcodec-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libcurl4-gnutls-dev \
            libgcrypt20-dev \
            libjson-c-dev \
            libncursesw5-dev \
            libsecret-1-dev \
            pkg-config

      - name: Validate contrib script syntax
        run: |
          sh -n \
            contrib/addshared.sh \
            contrib/headless_pianobar \
            contrib/remote.sh \
            contrib/tls_fingerprint.sh \
            scripts/package-release.sh
          bash -n \
            contrib/change-station-dmenu.sh \
            contrib/eventcmd-examples/eventcmd.sh \
            contrib/eventcmd-examples/multi.sh \
            contrib/headless_signalbox
          python3 -m py_compile \
            contrib/eventcmd-examples/scrobble.py \
            scripts/create-release-archive.py
          perl -c contrib/eventcmd-examples/dmenu.pl
          ruby -c contrib/eventcmd-examples/rbot.rb

      - name: Build
        run: |
          make clean
          make

      - name: Test
        run: make test

      - name: Inspect executable
        run: |
          test -x ./signalbox
          file ./signalbox
          ldd ./signalbox

      - name: Package Linux x86_64
        run: make package-linux

      - name: Upload Linux package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: signalbox-linux-x86_64
          path: |
            dist/signalbox-*-linux-x86_64.tar.gz
            dist/signalbox-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  macos:
    name: Build (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install dependencies
        run: brew install ffmpeg json-c libao libgcrypt make ncurses pkgconf

      - name: Build
        run: |
          gmake clean
          gmake

      - name: Test
        run: gmake test

      - name: Inspect executable
        run: |
          test -x ./signalbox
          file ./signalbox
          otool -L ./signalbox
